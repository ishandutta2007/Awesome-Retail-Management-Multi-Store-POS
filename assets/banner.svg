<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.28; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(400px); }
      }
      @keyframes radarSweep {
        0% { stroke-dashoffset: 400; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }

      .bg-grid { animation: pulseGrid 6s ease-in-out infinite; }
      .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
      .pill-float-2 { animation: floatReverse 6s ease-in-out infinite; }
      .pill-float-3 { animation: floatPill 7s ease-in-out 1s infinite; }
      .glowing-orb { animation: glowPulse 4s ease-in-out infinite; }
      .radar-line {
        stroke-dasharray: 200;
        animation: radarSweep 8s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
      }
    </style>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs in the background -->
  <circle class="glowing-orb" cx="180" cy="80" r="120" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle class="glowing-orb" cx="1020" cy="280" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle class="glowing-orb" cx="880" cy="60" r="90" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Architectural Grid (Behind content) -->
  <g class="bg-grid" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="4,6">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Flowing Network Connection Lines -->
  <path class="radar-line" d="M 60,180 Q 300,60 600,180 T 1140,180" fill="none" stroke="#6366f1" stroke-width="1.8" opacity="0.35" />
  <path class="radar-line" d="M 60,220 Q 300,320 600,220 T 1140,220" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Animated Background Store Location Nodes -->
  <g class="pill-float-1" opacity="0.4">
    <rect x="70" y="240" width="130" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="90" cy="259" r="5" fill="#22c55e" />
    <text x="105" y="264" fill="#94a3b8" class="badge-text">Store #01 • Online</text>
  </g>

  <g class="pill-float-2" opacity="0.4">
    <rect x="1000" y="65" width="130" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <circle cx="1020" cy="84" r="5" fill="#38bdf8" />
    <text x="1035" y="89" fill="#94a3b8" class="badge-text">Store #02 • Synced</text>
  </g>

  <g class="pill-float-3" opacity="0.4">
    <rect x="1010" y="250" width="135" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <circle cx="1030" cy="269" r="5" fill="#eab308" />
    <text x="1045" y="274" fill="#94a3b8" class="badge-text">Warehouse • Active</text>
  </g>

  <!-- Central Foreground Content Card (Solid High-Contrast Background so text is never obscured) -->
  <g id="foreground-content">
    <!-- Inner Card Backdrop -->
    <rect x="130" y="45" width="940" height="270" rx="20" fill="#0d1322" fill-opacity="0.94" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top Decorative Gradient Header Bar -->
    <rect x="130" y="45" width="940" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Category Pill Tag -->
    <g transform="translate(480, 72)">
      <rect x="0" y="0" width="240" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="120" y="18" fill="#38bdf8" text-anchor="middle" class="badge-text" letter-spacing="1">RETAIL TECH &amp; COMMERCE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" fill="#ffffff" font-size="35" class="title-text">
      Awesome Retail Management &amp; Multi-Store POS
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" fill="#cbd5e1" font-size="16" class="sub-text">
      Unified Point of Sale, Multi-Location Inventory &amp; Omnichannel Commerce Platforms
    </text>

    <!-- Tech Badges inside Card Foreground -->
    <g transform="translate(235, 228)">
      <!-- Badge 1: Multi-Store POS -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="17" fill="#132338" stroke="#0284c7" stroke-width="1.2" />
        <text x="67" y="22" fill="#38bdf8" text-anchor="middle" class="badge-text">🏪 Multi-Store POS</text>
      </g>

      <!-- Badge 2: Real-Time Inventory -->
      <g transform="translate(147, 0)">
        <rect width="165" height="34" rx="17" fill="#1f1d3d" stroke="#6366f1" stroke-width="1.2" />
        <text x="82" y="22" fill="#a5b4fc" text-anchor="middle" class="badge-text">📦 Real-Time Inventory</text>
      </g>

      <!-- Badge 3: Omnichannel Retail -->
      <g transform="translate(324, 0)">
        <rect width="170" height="34" rx="17" fill="#2d1c3a" stroke="#a855f7" stroke-width="1.2" />
        <text x="85" y="22" fill="#e879f9" text-anchor="middle" class="badge-text">🌐 Omnichannel Sync</text>
      </g>

      <!-- Badge 4: Open Source & SaaS -->
      <g transform="translate(506, 0)">
        <rect width="215" height="34" rx="17" fill="#0f2b26" stroke="#10b981" stroke-width="1.2" />
        <text x="107" y="22" fill="#34d399" text-anchor="middle" class="badge-text">⚡ SaaS &amp; Open-Source ERP</text>
      </g>
    </g>

    <!-- Footer Stats / Feature Indicator inside Foreground -->
    <text x="600" y="294" text-anchor="middle" fill="#64748b" font-size="12" class="badge-text">
      CURATED SOLUTIONS • ARCHITECTURAL COMPARISONS • PRICING &amp; FREE TIER MATRIX
    </text>
  </g>
</svg>
